
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1.5rem 0}
.header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.header h1{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.badge{font-size:12px;background:var(--color-background-info);color:var(--color-text-info);padding:3px 10px;border-radius:var(--border-radius-md)}
.meta-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.25rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--color-text-secondary);font-weight:500;letter-spacing:.3px}
.field input,.field select,.field textarea{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary);background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 10px;outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--color-border-primary)}
.field textarea{resize:vertical;line-height:1.6}
.section-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section-title i{font-size:15px}
.am-pm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eval-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stars{display:flex;gap:4px}
.star{font-size:20px;cursor:pointer;color:var(--color-border-secondary);transition:color .1s;user-select:none}
.star.on{color:#EF9F27}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;cursor:pointer;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);transition:all .15s}
.tag.sel{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent}
.tag.sel.neg{background:var(--color-background-danger);color:var(--color-text-danger)}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:12px 0}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:1.25rem}
button{font-family:var(--font-sans);font-size:14px;padding:8px 20px;border-radius:var(--border-radius-md);cursor:pointer;transition:all .15s}
.btn-outline{background:transparent;border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary)}
.btn-outline:hover{background:var(--color-background-secondary)}
.btn-primary{background:var(--color-background-info);color:var(--color-text-info);border:none;font-weight:500}
.btn-primary:hover{opacity:.85}
.preview-wrap{display:none;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-top:1rem;white-space:pre-wrap;font-size:13px;line-height:1.8;color:var(--color-text-primary);font-family:var(--font-mono)}
.preview-wrap.show{display:block}
.copy-row{display:flex;justify-content:flex-end;margin-top:8px}
.toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px 20px;font-size:13px;color:var(--color-text-primary);box-shadow:none;z-index:99}
.history-wrap{margin-top:1.5rem}
.hist-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px}
.hist-item{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--color-text-primary);display:flex;justify-content:space-between;align-items:center}
.hist-item:hover{background:var(--color-background-primary)}
.hist-del{font-size:12px;color:var(--color-text-danger);margin-left:10px}
</style>

<div class="wrap">
  <h2 class="sr-only">신입직원 멘티 일일 업무 일지 작성 폼</h2>
  <div class="header">
    <h1>멘티 일일 업무 일지</h1>
    <span class="badge">멘토 기록용</span>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-calendar" aria-hidden="true"></i>기본 정보</div>
    <div class="meta-row">
      <div class="field">
        <label>날짜</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>멘티 이름</label>
        <input type="text" id="f-name" placeholder="예) 홍동건">
      </div>
      <div class="field">
        <label>근무일수</label>
        <select id="f-day">
          <option value="">선택</option>
          <option value="1일차">1일차</option>
          <option value="2일차">2일차</option>
          <option value="3일차">3일차</option>
          <option value="4일차">4일차</option>
          <option value="5일차">5일차</option>
          <option value="2주차">2주차</option>
          <option value="3주차">3주차</option>
          <option value="4주차">4주차</option>
          <option value="직접입력">직접입력</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-sun" aria-hidden="true"></i>오전 업무 내용</div>
    <div class="field">
      <label>진행 업무 및 안내사항</label>
      <textarea id="f-am-work" rows="3" placeholder="오전에 진행하거나 안내한 업무를 기록해주세요"></textarea>
    </div>
    <div class="divider"></div>
    <div class="section-title" style="margin-bottom:8px"><i class="ti ti-clipboard-check" aria-hidden="true"></i>오전 특이사항</div>
    <div class="field">
      <textarea id="f-am-note" rows="2" placeholder="업무 태도, 반응, 이슈 등"></textarea>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-moon" aria-hidden="true"></i>오후 업무 내용</div>
    <div class="field">
      <label>진행 업무 및 안내사항</label>
      <textarea id="f-pm-work" rows="3" placeholder="오후에 진행하거나 안내한 업무를 기록해주세요"></textarea>
    </div>
    <div class="divider"></div>
    <div class="section-title" style="margin-bottom:8px"><i class="ti ti-clipboard-check" aria-hidden="true"></i>오후 특이사항</div>
    <div class="field">
      <textarea id="f-pm-note" rows="2" placeholder="업무 태도, 반응, 이슈 등"></textarea>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-star" aria-hidden="true"></i>오늘의 평가</div>
    <div class="eval-grid">
      <div class="field">
        <label>업무 이해도</label>
        <div class="stars" data-key="comprehension">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
        </div>
      </div>
      <div class="field">
        <label>업무 적극성</label>
        <div class="stars" data-key="proactivity">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
        </div>
      </div>
      <div class="field">
        <label>커뮤니케이션</label>
        <div class="stars" data-key="communication">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
        </div>
      </div>
      <div class="field">
        <label>업무 마무리</label>
        <div class="stars" data-key="followthrough">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
        </div>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>주요 태도 태그 (긍정)</label>
      <div class="tag-row" id="tags-pos">
        <span class="tag" data-val="경청 잘함">경청 잘함</span>
        <span class="tag" data-val="질문 적극적">질문 적극적</span>
        <span class="tag" data-val="빠른 습득">빠른 습득</span>
        <span class="tag" data-val="자기주도적">자기주도적</span>
        <span class="tag" data-val="꼼꼼함">꼼꼼함</span>
        <span class="tag" data-val="밝은 태도">밝은 태도</span>
      </div>
    </div>
    <div class="field">
      <label>주요 태도 태그 (개선필요)</label>
      <div class="tag-row" id="tags-neg">
        <span class="tag neg" data-val="메모 안함">메모 안함</span>
        <span class="tag neg" data-val="수동적 태도">수동적 태도</span>
        <span class="tag neg" data-val="확인 부족">확인 부족</span>
        <span class="tag neg" data-val="소통 부재">소통 부재</span>
        <span class="tag neg" data-val="집중력 저하">집중력 저하</span>
        <span class="tag neg" data-val="보고 누락">보고 누락</span>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-arrow-right" aria-hidden="true"></i>내일 예정 업무 / 인수인계 사항</div>
    <div class="field">
      <textarea id="f-next" rows="2" placeholder="내일 진행할 업무 또는 이어서 안내할 내용"></textarea>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="ti ti-notes" aria-hidden="true"></i>멘토 종합 코멘트</div>
    <div class="field">
      <textarea id="f-comment" rows="3" placeholder="전반적인 하루 평가, 상무님께 보고할 내용 등"></textarea>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-outline" onclick="resetForm()">초기화</button>
    <button class="btn-primary" onclick="generatePreview()"><i class="ti ti-file-text" aria-hidden="true"></i> 일지 생성</button>
  </div>

  <div class="preview-wrap" id="preview"></div>
  <div class="copy-row" id="copy-row" style="display:none">
    <button class="btn-outline" onclick="copyText()"><i class="ti ti-copy" aria-hidden="true"></i> 복사</button>
    <button class="btn-outline" onclick="saveRecord()"><i class="ti ti-device-floppy" aria-hidden="true"></i> 저장</button>
  </div>

  <div class="history-wrap" id="hist-section" style="display:none">
    <div class="hist-title">저장된 일지</div>
    <div id="hist-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const starVals = {comprehension:0, proactivity:0, communication:0, followthrough:0};
const tagLabels = {comprehension:'업무 이해도', proactivity:'업무 적극성', communication:'커뮤니케이션', followthrough:'업무 마무리'};

document.querySelectorAll('.stars').forEach(group=>{
  const key=group.dataset.key;
  group.querySelectorAll('.star').forEach(s=>{
    s.onclick=()=>{
      starVals[key]=+s.dataset.v;
      group.querySelectorAll('.star').forEach(ss=>ss.classList.toggle('on',+ss.dataset.v<=starVals[key]));
    };
  });
});

document.querySelectorAll('#tags-pos .tag').forEach(t=>{
  t.onclick=()=>t.classList.toggle('sel');
});
document.querySelectorAll('#tags-neg .tag').forEach(t=>{
  t.onclick=()=>t.classList.toggle('sel');
});

const today=new Date();
document.getElementById('f-date').value=today.toISOString().split('T')[0];

function getTagsSelected(id){
  return [...document.querySelectorAll(`#${id} .tag.sel`)].map(t=>t.dataset.val);
}

function starStr(v){return '★'.repeat(v)+'☆'.repeat(5-v)}

function generatePreview(){
  const date=document.getElementById('f-date').value;
  const name=document.getElementById('f-name').value||'(미입력)';
  const dayN=document.getElementById('f-day').value;
  const amWork=document.getElementById('f-am-work').value;
  const amNote=document.getElementById('f-am-note').value;
  const pmWork=document.getElementById('f-pm-work').value;
  const pmNote=document.getElementById('f-pm-note').value;
  const next=document.getElementById('f-next').value;
  const comment=document.getElementById('f-comment').value;
  const pos=getTagsSelected('tags-pos');
  const neg=getTagsSelected('tags-neg');

  const d=new Date(date);
  const days=['일','월','화','수','목','금','토'];
  const dateStr=date?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`:'날짜 미입력';

  let txt='';
  txt+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt+=`📋 멘티 일일 업무 일지\n`;
  txt+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt+=`▸ 날짜   : ${dateStr}${dayN?' / '+dayN:''}\n`;
  txt+=`▸ 멘티   : ${name}\n\n`;

  txt+=`[오전]\n`;
  if(amWork) txt+=`• 업무 내용\n${amWork}\n\n`;
  if(amNote) txt+=`• 특이사항\n${amNote}\n\n`;
  if(!amWork&&!amNote) txt+=`(기록 없음)\n\n`;

  txt+=`[오후]\n`;
  if(pmWork) txt+=`• 업무 내용\n${pmWork}\n\n`;
  if(pmNote) txt+=`• 특이사항\n${pmNote}\n\n`;
  if(!pmWork&&!pmNote) txt+=`(기록 없음)\n\n`;

  txt+=`[오늘의 평가]\n`;
  Object.keys(starVals).forEach(k=>{
    txt+=`• ${tagLabels[k]} : ${starStr(starVals[k])} (${starVals[k]}/5)\n`;
  });
  if(pos.length) txt+=`• 긍정 태도 : ${pos.join(', ')}\n`;
  if(neg.length) txt+=`• 개선 필요 : ${neg.join(', ')}\n`;
  txt+='\n';

  if(next){
    txt+=`[내일 예정 / 인수인계]\n${next}\n\n`;
  }
  if(comment){
    txt+=`[멘토 종합 코멘트]\n${comment}\n`;
  }
  txt+=`━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

  const el=document.getElementById('preview');
  el.textContent=txt;
  el.classList.add('show');
  document.getElementById('copy-row').style.display='flex';
}

function copyText(){
  const txt=document.getElementById('preview').textContent;
  navigator.clipboard.writeText(txt).then(()=>showToast('클립보드에 복사됐어요!'));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',2200);
}

function saveRecord(){
  const key='mentee_logs';
  const existing=JSON.parse(localStorage.getItem(key)||'[]');
  const entry={
    date:document.getElementById('f-date').value,
    name:document.getElementById('f-name').value,
    day:document.getElementById('f-day').value,
    text:document.getElementById('preview').textContent,
    saved:new Date().toLocaleString('ko-KR')
  };
  existing.unshift(entry);
  localStorage.setItem(key,JSON.stringify(existing));
  renderHistory();
  showToast('저장됐어요!');
}

function renderHistory(){
  const key='mentee_logs';
  const logs=JSON.parse(localStorage.getItem(key)||'[]');
  const sec=document.getElementById('hist-section');
  const list=document.getElementById('hist-list');
  if(!logs.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML='';
  logs.forEach((l,i)=>{
    const item=document.createElement('div');
    item.className='hist-item';
    item.innerHTML=`<span>${l.date} · ${l.name} ${l.day?'('+l.day+')':''}</span><span><span style="font-size:11px;color:var(--color-text-tertiary)">${l.saved}</span><span class="hist-del" onclick="deleteLog(${i},event)">삭제</span></span>`;
    item.onclick=()=>{
      document.getElementById('preview').textContent=l.text;
      document.getElementById('preview').classList.add('show');
      document.getElementById('copy-row').style.display='flex';
    };
    list.appendChild(item);
  });
}

function deleteLog(i,e){
  e.stopPropagation();
  const key='mentee_logs';
  const logs=JSON.parse(localStorage.getItem(key)||'[]');
  logs.splice(i,1);
  localStorage.setItem(key,JSON.stringify(logs));
  renderHistory();
}

function resetForm(){
  document.getElementById('f-am-work').value='';
  document.getElementById('f-am-note').value='';
  document.getElementById('f-pm-work').value='';
  document.getElementById('f-pm-note').value='';
  document.getElementById('f-next').value='';
  document.getElementById('f-comment').value='';
  document.querySelectorAll('.star').forEach(s=>s.classList.remove('on'));
  Object.keys(starVals).forEach(k=>starVals[k]=0);
  document.querySelectorAll('.tag.sel').forEach(t=>t.classList.remove('sel'));
  document.getElementById('preview').classList.remove('show');
  document.getElementById('copy-row').style.display='none';
}

renderHistory();
</script>
